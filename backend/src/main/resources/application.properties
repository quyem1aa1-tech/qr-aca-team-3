spring.application.name=attendance
server.port=8080

# MySQL connection (override with env vars DB_URL / DB_USERNAME / DB_PASSWORD)
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/school_attendance?createDatabaseIfNotExist=true&useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:123}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# Tables are created from the entities (see also src/main/resources/schema.sql for the raw MySQL DDL)
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.jdbc.time_zone=UTC

# JWT (override JWT_SECRET in production, must be >= 32 chars)

app.jwt.secret=${JWT_SECRET:change-me-please-change-me-0123456789abcdef}  
app.jwt.expiration-minutes=${JWT_EXPIRATION_MINUTES:480}
#i will changes these later
# QR lifetime in minutes (configurable)
app.qr.expiration-minutes=${QR_EXPIRATION_MINUTES:15}

# Insert demo teacher/students/class when the DB is empty
app.seed.enabled=${SEED_ENABLED:true}

# Allowed frontend origin
app.cors.allowed-origins=${CORS_ORIGINS:http://localhost:5173,http://localhost:3000}
