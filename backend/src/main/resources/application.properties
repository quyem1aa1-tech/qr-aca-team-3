spring.application.name=attendance
spring.config.import=optional:file:.env[.properties]
server.address=0.0.0.0
server.port=${PORT:4000}

# MySQL connection (override with env vars DB_URL / DB_USERNAME / DB_PASSWORD)
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/qr_attendance?createDatabaseIfNotExist=true&useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:123}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# Tables are created from the entities (see also src/main/resources/schema.sql for the raw MySQL DDL)
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.jdbc.time_zone=UTC

# JWT
app.jwt.secret=${JWT_SECRET:change-me-please-change-me-0123456789abcdef}
app.jwt.expiration-minutes=${JWT_EXPIRATION_MINUTES:480}

# QR lifetime in minutes (configurable)
app.qr.expiration-minutes=${QR_TTL_MINUTES:${QR_EXPIRATION_MINUTES:15}}

# Insert demo teacher/students/class when the DB is empty
app.seed.enabled=${SEED_ENABLED:true}

# Allowed frontend origin
app.cors.allowed-origins=${FRONTEND_ORIGIN:${CORS_ORIGINS:http://192.168.0.184:3000}}
