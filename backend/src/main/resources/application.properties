spring.application.name=attendance

# 1. Cổng Backend chạy (mặc định 8080)
server.port=8080

# 2. Cấu hình kết nối MySQL
spring.datasource.url=jdbc:mysql://localhost:3306/school_attendance?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
spring.datasource.username=root
spring.datasource.password=123
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# 3. Tự động cập nhật / tạo bảng trong Database từ code Java
spring.jpa.hibernate.ddl-auto=update

# 4. Hiển thị câu lệnh SQL ở Terminal để dễ kiểm tra khi chấm điểm
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true